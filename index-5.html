<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدیکا | کاتالوگ آنلاین</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap">
<style>
:root{--bg:#fbf6f4;--ink:#3b2d30;--muted:#8a7a7c;--brand:#d3366f;--line:#eadcd8;--card:#fff;--sh:rgba(59,45,48,.18);--mint:#c9f1e8;--pink:#fbd9e3;--e:cubic-bezier(.2,.8,.2,1);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171214;--ink:#f4e9e6;--muted:#a99a9c;--brand:#ff6a9e;--line:#32282b;--card:#221a1d;--sh:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#171214;--ink:#f4e9e6;--muted:#a99a9c;--brand:#ff6a9e;--line:#32282b;--card:#221a1d;--sh:rgba(0,0,0,.55)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.8;padding-bottom:88px;overflow-x:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hero{background:linear-gradient(100deg,var(--mint),#f3f1ee 50%,var(--pink));color:#3b2d30;position:relative;overflow:hidden;perspective:800px}
.ly{position:absolute;inset:0;pointer-events:none;transform:translate3d(calc(var(--px,0)*var(--k)*1px),calc(var(--py,0)*var(--k)*1px),0);transition:transform .25s ease-out}
.blob{position:absolute;width:300px;height:300px;top:8px;left:50%;margin-left:-150px;background:linear-gradient(135deg,rgba(211,54,111,.22),rgba(120,220,200,.38));animation:morph 9s ease-in-out infinite}
@keyframes morph{0%,100%{border-radius:60% 40% 55% 45%/50% 60% 40% 50%;transform:rotate(0)}50%{border-radius:35% 65% 40% 60%/60% 35% 65% 40%;transform:rotate(90deg)}}
.orb{position:absolute;border-radius:50%;animation:fl 6s ease-in-out infinite}
.orb.a{width:54px;height:54px;top:30px;right:12%;background:radial-gradient(circle at 30% 30%,#fff,rgba(211,54,111,.55))}
.orb.b{width:34px;height:34px;bottom:34px;left:14%;background:radial-gradient(circle at 30% 30%,#fff,rgba(90,200,180,.6));animation-delay:-3s}
.orb.c{width:20px;height:20px;top:90px;left:24%;background:radial-gradient(circle at 30% 30%,#fff,rgba(211,54,111,.4));animation-delay:-1.5s}
@keyframes fl{0%,100%{translate:0 0}50%{translate:0 -14px}}
.hero .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 16px 30px;position:relative}
#logo{width:min(250px,62vw);mix-blend-mode:multiply;transform:rotateY(calc(var(--px,0)*16deg)) rotateX(calc(var(--py,0)*-11deg)) translate3d(calc(var(--px,0)*-10px),calc(var(--py,0)*-6px),40px);transition:transform .25s ease-out;will-change:transform}
.hero p{margin:4px 0 0;font-size:15px;max-width:30ch;font-weight:300}
.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 16px 6px;scrollbar-width:none;max-width:1100px;margin:0 auto;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
button,.go,.bar a{position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s}
button:active,.go:active,.bar a:active{transform:scale(.94)}
.chip{flex:none;scroll-snap-align:start;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:5px 16px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 6px 14px -6px var(--brand)}
button:focus-visible,a:focus-visible,.card:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);width:10px;height:10px;margin:-5px 0 0 -5px;pointer-events:none;animation:rp .6s ease-out forwards}
.chip .rip{background:rgba(211,54,111,.25)}
@keyframes rp{to{transform:scale(28);opacity:0}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 0 30px;grid-auto-flow:dense;perspective:1200px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:14px;box-shadow:0 10px 26px -14px var(--sh);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));translate:0 30px;opacity:0;
  transition:translate .8s var(--e) var(--d,0s),opacity .8s var(--e) var(--d,0s),transform .25s ease-out,box-shadow .25s}
.card.in{translate:0 0;opacity:1}
.card[hidden]{display:none}
.card.land{grid-column:span 2}
.card.tilt{transition:translate .8s var(--e) var(--d,0s),opacity .8s var(--e) var(--d,0s),transform .06s linear,box-shadow .25s;box-shadow:0 22px 34px -16px var(--sh)}
.card img{display:block;width:100%;height:auto;background:var(--line)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.35),transparent 55%);transition:opacity .2s}
.card.tilt::after{opacity:1}
.meta{padding:10px 12px 12px 52px;transform:translateZ(20px)}
.meta h3{margin:0;font-size:14px;font-weight:500;line-height:1.6}
.meta .pr{font-weight:800;color:var(--brand);font-size:14px}
.add{position:absolute;left:10px;bottom:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:22px;line-height:1;cursor:pointer;transform:translateZ(40px);box-shadow:0 6px 12px -4px var(--brand)}
.add.ok{background:#27a779}
#ov,#co{position:fixed;inset:0;z-index:20;background:rgba(23,18,20,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;overflow-y:auto}
#ov{padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px))}
#ov.on,#co.on{display:block}
#co.on{animation:fi .25s}
@keyframes fi{from{opacity:0}}
.sheet{max-width:560px;margin:0 auto;background:var(--card);border-radius:18px;padding:12px;perspective:1000px}
.imgbox{position:relative;border-radius:12px;overflow:hidden;background:var(--line);transition:transform .15s ease-out;touch-action:pan-y;user-select:none}
#big{display:block;width:100%;height:auto;max-height:64vh;object-fit:contain;margin:0 auto;pointer-events:none}
.arr{position:absolute;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.8);color:#3b2d30;font-size:22px;cursor:pointer}
.arr.l{left:8px}.arr.r{right:8px}
.info{padding:12px 6px 4px}
.info h2{margin:0;font-size:20px}.info .s{color:var(--muted);font-size:14px}
.info .p{font-weight:800;color:var(--brand);font-size:20px;margin-top:4px}
.row{display:flex;gap:8px;margin-top:12px}
.go{flex:1;text-align:center;text-decoration:none;background:var(--brand);color:#fff;padding:12px;border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer;display:block}
.go.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.sq{flex:none;width:38px;height:38px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;font:inherit;font-size:20px;cursor:pointer}
.panel{position:absolute;inset:auto 0 0 0;max-height:82vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .4s var(--e)}
@keyframes up{from{transform:translateY(100%)}}
.panel h2{margin:0 0 8px;font-size:19px}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it .nm{flex:1;font-size:14px}.it .nm small{display:block;color:var(--muted)}
.q{display:flex;align-items:center;gap:6px}
.tot{display:flex;justify-content:space-between;font-weight:800;padding:14px 0 4px;font-size:17px}
.empty{color:var(--muted);padding:24px 0;text-align:center}
::view-transition-group(hero-img){animation-duration:.45s;animation-timing-function:var(--e)}
h2.t{font-size:22px;margin:10px 0 12px}
.br{display:grid;gap:10px;padding-bottom:30px}
.br div{padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.br b{display:block;font-weight:500}.br span{color:var(--muted);font-size:14px}
.bar{position:fixed;inset:auto 0 0 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
.bar a{display:block;width:100%;max-width:520px;text-align:center;text-decoration:none;background:var(--brand);color:#fff;padding:12px;border-radius:12px;font-weight:800}
@media (prefers-reduced-motion:reduce){.blob,.orb{animation:none}html{scroll-behavior:auto}*{transition:none!important}.card{translate:0 0;opacity:1}}
</style>
</head>

/* ripple on buttons */
addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest(".go,.sq,.chip,.add,.bar a,.arr");if(!b)return;

/* hero parallax: pointer + phone tilt */
const hero=$("hero"),setP=(x,y)=>{hero.style.setProperty("--px",Math.max(-1,Math.min(1,x)));hero.style.setProperty("--py",Math.max(-1,Math.min(1,y)))};
hero.addEventListener("pointermove",e=>{const r=hero.getBoundingClientRect();setP(((e.clientX-r.left)/r.width-.5)*2,((e.clientY-r.top)/r.height-.5)*2)});

addEventListener("deviceorientation",e=>{if(e.gamma==null)return;setP(-e.gamma/28,(e.beta-45)/28)});

/* card tilt */
function tilt(el,max){
  const mv=e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    el.style.setProperty("--ry",((x-.5)*max)+"deg");el.style.setProperty("--rx",((.5-y)*max)+"deg");
    el.style.setProperty("--gx",x*100+"%");el.style.setProperty("--gy",y*100+"%");el.classList.add("tilt")};
  const rs=()=>{el.style.setProperty("--rx","0deg");el.style.setProperty("--ry","0deg");el.classList.remove("tilt")};
  el.addEventListener("pointermove",mv);el.addEventListener("pointerdown",mv);
  ["pointerleave","pointerup","pointercancel"].forEach(t=>el.addEventListener(t,rs));
}

function setCat(c){
  const first=new Map();cards.forEach(el=>{if(!el.hidden)first.set(el,el.getBoundingClientRect())});
  cur=c;cards.forEach((el,i)=>{el.hidden=!(c==="همه"||SHOP.products[i].c===c);if(!el.hidden)el.classList.add("in")});
  cards.forEach(el=>{if(el.hidden||!el.animate)return;const f=first.get(el),l=el.getBoundingClientRect();
    if(f)el.animate([{transform:"translate("+(f.left-l.left)+"px,"+(f.top-l.top)+"px)"},{transform:"none"}],{duration:480,easing:"cubic-bezier(.2,.8,.2,1)"});
    else el.animate([{opacity:0,transform:"scale(.85)"},{opacity:1,transform:"none"}],{duration:420,easing:"ease-out"})});
  drawChips()}
function drawChips(){chips.innerHTML="";cats.forEach(c=>{const b=document.createElement("button");b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===cur);b.onclick=()=>setCat(c);chips.appendChild(b)})}
drawChips();upd();

/* detail view: morph + swipe gallery */
const ov=$("ov"),big=$("big"),ib=$("ib");let idx=0;
function fill(i){idx=i;const p=SHOP.products[i];big.src=IMG[p.i];big.alt=p.n;big.width=p.w;big.height=p.h;
  $("bn").textContent=p.n;$("bs").textContent=p.s;$("bp").textContent=fmt(p.v)+" تومان";
  $("bo").href=wa("سلام، می‌خواهم «"+p.n+"» را سفارش بدهم.")}
function openP(i){const src=cards[i].querySelector("img");
  const show=()=>{fill(i);ov.classList.add("on");document.body.style.overflow="hidden";$("cl").focus({preventScroll:true})};
  if(!document.startViewTransition){show();return}
  src.style.viewTransitionName="hero-img";
  document.startViewTransition(()=>{src.style.viewTransitionName="";show();big.style.viewTransitionName="hero-img"}).finished.finally(()=>big.style.viewTransitionName="")}
function closeP(){const src=cards[idx].querySelector("img");
  const hide=()=>{ov.classList.remove("on");document.body.style.overflow=""};
  if(!document.startViewTransition){hide();return}
  big.style.viewTransitionName="hero-img";
  document.startViewTransition(()=>{big.style.viewTransitionName="";hide();src.style.viewTransitionName="hero-img"}).finished.finally(()=>src.style.viewTransitionName="")}
function step(d){const vis=SHOP.products.map((p,i)=>i).filter(i=>!cards[i].hidden);let k=vis.indexOf(idx);k=(k+d+vis.length)%vis.length;fill(vis[k]);
  big.animate&&big.animate([{transform:"translateX("+(d>0?-60:60)+"px)",opacity:0},{transform:"none",opacity:1}],{duration:340,easing:"cubic-bezier(.2,.8,.2,1)"})}
$("cl").onclick=closeP;$("nx").onclick=()=>step(1);$("pv").onclick=()=>step(-1);
$("ba").onclick=e=>{add(idx,1);const b=$("ba"),t="افزودن به سبد";b.textContent="✓ اضافه شد";setTimeout(()=>b.textContent=t,1000)};
ov.addEventListener("click",e=>{if(e.target===ov)closeP()});
addEventListener("keydown",e=>{if(e.key==="Escape"){if($("co").classList.contains("on"))closeCart();else if(ov.classList.contains("on"))closeP()}
  if(ov.classList.contains("on")){if(e.key==="ArrowLeft")step(1);if(e.key==="ArrowRight")step(-1)}});
let sx=null;
ib.addEventListener("pointerdown",e=>{sx=e.clientX});
ib.addEventListener("pointerup",e=>{ib.style.transform="";if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>48)step(dx<0?1:-1)});
ib.addEventListener("pointercancel",()=>{sx=null;ib.style.transform=""});
ib.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const r=ib.getBoundingClientRect();
  ib.style.transform="perspective(900px) rotateY("+(((e.clientX-r.left)/r.width-.5)*8)+"deg) rotateX("+((.5-(e.clientY-r.top)/r.height)*6)+"deg)"});
ib.addEventListener("pointerleave",()=>ib.style.transform="");
</script>
